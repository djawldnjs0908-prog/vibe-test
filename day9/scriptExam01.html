<script>
    // let 키워드 변수는 가변수
    // 가변수란 변수의 값이 변할 수 있다 
    let name = "홍길동"; /*세미콜론은 마침표 같은 느낌이며, 마침표를 안 준다고 해서 에러가 나진 않음 */
    let age;

    age = age + 1; // 기존 age 변수가 가진 값에 1을 더해서 다시 age 에 대입
    // 이런식으로 값을 변경할 수 있는게 가변수 = let

    console.log('이름:' + name + ', 나이: ' + age);

    //const 키워드 변수는 불변수
    // 불변수는 처음 지닌 값을 바꿀 수 없다
    // 불변수는 무조건 선언 시 초기값을 주어야 한다
    const pi = 3.14; //파이처럼 기존 값을 바꿀 수 없는 것

    /* 라이브 서버를 켰을 때 화면에서는 나오지 않음 */
    /* 변수는 명사용, 함수는 동사용이다 */
    /* 함수는 펑션을 붙여야 한다 */ 
</script>
</html>

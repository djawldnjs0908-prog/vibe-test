<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>취미생활 : </label>
    <input type="checkbox" id="walk" name="hobby"value="산책">
    <label for="walk">산책</label>
    <input type="checkbox" id="music" name="hobby"value="음악감상">
    <label for="music">음악감상</label>
    <input type="checkbox" id="game" name="hobby"value="게임">
    <label for="game">게임</label>
    <br>
    <label>성별 : </label>
    <input type="radio" id="man" name="gender" value="남자">
    <label for="man">남자</label>
    <input type="radio" id="woman" name="gender" value="여자" checked>
    <label for="woman">여자</label>
    <br>
    <!--seiect box-->
    <label>도시 : </label>
    <select>
        <option value="춘천">춘천</option>
        <option value="강릉">강릉</option>
        <option value="양양">양양</option>
        <option value="대전">대전</option>
        <option value="서울">서울</option>
        <option value="판교">판교</option>
    </select>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Map</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">

    <!-- 헤더 -->
    <header class="app-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <h1 class="app-title m-0">
        <i class="bi bi-cloud-sun"></i> Weather Map
      </h1>
      <ul class="nav nav-pills tab-pills" id="tabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="kr" type="button">대한민국 날씨</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="world" type="button">세계 날씨</button>
        </li>
      </ul>
    </header>

    <!-- 지도 -->
    <div id="map" class="map mb-3"></div>

    <!-- 에러 -->
    <div id="error" class="alert alert-warning d-none align-items-center justify-content-between gap-3" role="alert">
      <span id="error-message"></span>
      <button id="retry" class="btn btn-sm btn-outline-dark" type="button">다시 시도</button>
    </div>

    <!-- 카드 -->
    <section class="card-grid mb-3">
      <article class="info-card main-card">
        <div class="main-name" id="main-name">-</div>
        <div class="main-sub" id="main-sub">-</div>
        <div class="main-temp" id="main-temp">-</div>
        <div class="main-desc" id="main-desc">-</div>
      </article>

      <article class="info-card card-temp">
        <div class="card-label"><i class="bi bi-thermometer-half"></i> 최고 / 최저</div>
        <div class="card-value" id="val-minmax">-</div>
      </article>

      <article class="info-card card-wind">
        <div class="card-label"><i class="bi bi-wind"></i> 풍속</div>
        <div class="card-value" id="val-wind-speed">-</div>
      </article>

      <article class="info-card card-dir">
        <div class="card-label"><i class="bi bi-compass"></i> 풍향</div>
        <div class="card-value" id="val-wind-dir">-</div>
        <div class="card-sub" id="sub-wind-dir"></div>
      </article>

      <article class="info-card card-humidity">
        <div class="card-label"><i class="bi bi-droplet"></i> 습도</div>
        <div class="card-value" id="val-humidity">-</div>
      </article>

      <article class="info-card card-pm10">
        <div class="card-label"><i class="bi bi-cloud-haze2"></i> 미세먼지</div>
        <div class="card-value" id="val-pm10">-</div>
        <div class="card-sub" id="sub-pm10"></div>
      </article>

      <article class="info-card card-pm25">
        <div class="card-label"><i class="bi bi-cloud-haze"></i> 초미세먼지</div>
        <div class="card-value" id="val-pm25">-</div>
        <div class="card-sub" id="sub-pm25"></div>
      </article>
    </section>

    <!-- 5일 예보 -->
    <section class="info-card forecast-card">
      <div class="card-label mb-3"><i class="bi bi-calendar3"></i> 5일 예보</div>
      <div class="forecast-grid" id="forecast"></div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

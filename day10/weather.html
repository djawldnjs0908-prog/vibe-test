<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 대시보드</title>
    <!-- 부트스트랩 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 부트스트랩 아이콘 CDN (대시보드 항목 이미지용) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2ff 0%, #fdf6ff 50%, #fff7e6 100%);
            font-family: "Pretendard", "Malgun Gothic", sans-serif;
            color: #334155;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(100, 116, 139, 0.15);
        }

        .form-select,
        .btn-search {
            border-radius: 50px;
            padding: 12px 20px;
        }

        .btn-search {
            background: linear-gradient(135deg, #f3f6f9, #a78bfa);
            border: none;
            color: #fff;
            font-weight: 600;
        }

        .btn-search:hover {
            color: #fff;
            opacity: 0.9;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 32px;
            box-shadow: 0 15px 40px rgba(100, 116, 139, 0.18);
        }

        .main-weather img {
            width: 120px;
            height: 120px;
        }

        .main-temp {
            font-size: 3.5rem;
            font-weight: 700;
            color: #1e293b;
        }

        .tile {
            border-radius: 24px;
            padding: 20px;
            height: 100%;
            text-align: center;
        }

        .tile i {
            font-size: 2.2rem;
        }

        .tile .label {
            font-size: 0.9rem;
            color: #64748b;
        }

        .tile .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
        }

        .tile-humidity { background: #e0f2fe; color: #0284c7; }
        .tile-wind-deg { background: #ede9fe; color: #7c3aed; }
        .tile-wind     { background: #dcfce7; color: #16a34a; }
        .tile-max      { background: #ffe4e6; color: #e11d48; }
        .tile-min      { background: #fef9c3; color: #ca8a04; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <h1 class="text-center fw-bold mb-4">🌤️ 오늘의 날씨</h1>

                <!-- 도시 선택 영역 -->
                <div class="search-box p-4 mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-8">
                            <select id="citySelect" class="form-select">
                                <option value="">도시를 선택하세요</option>
                                <option value="Seoul">서울</option>
                                <option value="Busan">부산</option>
                                <option value="Incheon">인천</option>
                                <option value="Daegu">대구</option>
                                <option value="Daejeon">대전</option>
                                <option value="Gwangju">광주</option>
                                <option value="Ulsan">울산</option>
                                <option value="Jeju City">제주</option>
                                <option value="Tokyo">도쿄</option>
                                <option value="Beijing">베이징</option>
                                <option value="New York">뉴욕</option>
                                <option value="London">런던</option>
                                <option value="Paris">파리</option>
                                <option value="Sydney">시드니</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-grid">
                            <button type="button" class="btn btn-search" onclick="searchWeather();">
                                <i class="bi bi-search"></i> 날씨 검색
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 날씨 카드 대시보드 (검색 후 표시) -->
                <div id="weatherCard" class="card weather-card p-4 d-none">
                    <div class="main-weather text-center mb-4">
                        <h2 id="cityName" class="fw-bold mb-0"></h2>
                        <img id="weatherIcon" src="" alt="날씨 아이콘">
                        <div id="temp" class="main-temp"></div>
                        <div id="description" class="fs-5 text-secondary"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-6 col-md-4">
                            <div class="tile tile-humidity">
                                <i class="bi bi-droplet-fill"></i>
                                <div class="label">습도</div>
                                <div id="humidity" class="value"></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="tile tile-wind-deg">
                                <i id="windArrow" class="bi bi-arrow-up-circle-fill d-inline-block"></i>
                                <div class="label">풍향</div>
                                <div id="windDeg" class="value"></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="tile tile-wind">
                                <i class="bi bi-wind"></i>
                                <div class="label">풍속</div>
                                <div id="windSpeed" class="value"></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-6">
                            <div class="tile tile-max">
                                <i class="bi bi-thermometer-sun"></i>
                                <div class="label">최고 온도</div>
                                <div id="tempMax" class="value"></div>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="tile tile-min">
                                <i class="bi bi-thermometer-snow"></i>
                                <div class="label">최저 온도</div>
                                <div id="tempMin" class="value"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script>
    // ★ 여기에 OpenWeather API 키를 직접 입력하세요
    const API_KEY = '388b81c631f1f5240e197e7bc3c83434';

    // 풍향 각도(0~360)를 16방위 이름으로 변환
    function getWindDirection(deg) {
        const directions = ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동',
                            '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'];
        return directions[Math.round(deg / 22.5) % 16];
    }

    function searchWeather() {
        const city = document.getElementById('citySelect').value;

        if (API_KEY === '') {
            alert('API 키를 먼저 입력해주세요.');
            return;
        }
        if (city === '') {
            alert('도시를 선택해주세요.');
            return;
        }

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=kr`;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('날씨 정보를 가져오지 못했습니다. (' + response.status + ')');
                }
                return response.json();
            })
            .then(data => showWeather(data))
            .catch(error => alert(error.message));
    }

    function showWeather(data) {
        const select = document.getElementById('citySelect');
        const cityLabel = select.options[select.selectedIndex].text;

        document.getElementById('cityName').textContent = cityLabel;
        document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;
        document.getElementById('temp').textContent = Math.round(data.main.temp) + '°C';
        document.getElementById('description').textContent = data.weather[0].description;

        document.getElementById('humidity').textContent = data.main.humidity + '%';
        document.getElementById('windDeg').textContent = getWindDirection(data.wind.deg) + ' (' + data.wind.deg + '°)';
        // 화살표 아이콘을 바람이 불어가는 방향으로 회전
        document.getElementById('windArrow').style.transform = `rotate(${data.wind.deg + 180}deg)`;
        document.getElementById('windSpeed').textContent = data.wind.speed + ' m/s';
        document.getElementById('tempMax').textContent = Math.round(data.main.temp_max) + '°C';
        document.getElementById('tempMin').textContent = Math.round(data.main.temp_min) + '°C';

        document.getElementById('weatherCard').classList.remove('d-none');
    }
</script>
</html>

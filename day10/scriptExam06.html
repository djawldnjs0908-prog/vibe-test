<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="start"> +
    <input type="number" id="end"> =
    <span id="result">?</span><br>
    <button type="button" onclick="add();">결과</button>
</body>
<script>
    function add(){
    //자바스크립트에서 input 값을 가져오면 무조건 문자로 처리 됨
    const num01 = document.getElementById('start').value;
    const num02 = document.getElementById('end').value; 
    const resultSpan = document.getElementById('result');
    let result = 0;
        //넘버 함수는 무조건 대문자로
    for(let i = Number(num01); i <= Number(num02); i++){
    if(i % 2 === 0){
        result = result + i;
    }
}
    

    resultSpan.textContent = result;
    }
</script>
</html>
